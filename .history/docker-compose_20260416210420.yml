services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REACT_APP_URL: ${REACT_APP_URL:-http://localhost:4001}
        REACT_APP_ENV: ${REACT_APP_ENV:-production}
        REACT_APP_SERVER: ${REACT_APP_SERVER:-http://host.docker.internal:4000}
    container_name: next-movie-app
    ports:
      - "4001:4001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: 4001
      REACT_APP_URL: ${REACT_APP_URL:-http://localhost:4001}
      REACT_APP_ENV: ${REACT_APP_ENV:-production}
      REACT_APP_SERVER: ${REACT_APP_SERVER:-http://host.docker.internal:4000}
    networks:
      - nest_movie

networks:
  nest_movie:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
